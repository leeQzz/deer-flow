[project]
name = "operix-extension-jev-screening"
version = "0.1.0"
description = "Opt-in advisory screening of fetched content, contributed as a Operix extension middleware"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "operix-extension-api>=0.2.3,<0.3",
    "httpx>=0.28,<1",
    "langchain>=1.3,<2",
    "langgraph>=1.2.9,<1.3",
    "pydantic>=2.12,<3",
]

[project.entry-points."operix.extensions"]
jev-screening = "operix_extension_jev_screening:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["operix_extension_jev_screening"]

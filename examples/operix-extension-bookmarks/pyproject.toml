[project]
name = "operix-extension-bookmarks"
version = "0.2.0"
description = "Pi-inspired conversation bookmarks for the Operix full-stack plugin API"
requires-python = ">=3.12"
license = "MIT"
license-files = ["THIRD_PARTY_NOTICES.md"]
dependencies = ["operix-extension-api>=0.2.3,<0.3"]

[project.entry-points."operix.extensions"]
bookmarks = "operix_extension_bookmarks:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["operix_extension_bookmarks"]
